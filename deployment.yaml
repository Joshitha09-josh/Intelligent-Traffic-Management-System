
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-dashboard
  labels:
    app: traffic-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: traffic-dashboard
    spec:
      containers:
        - name: traffic-app
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-dashboard-service
spec:
  type: NodePort
  selector:
    app: traffic-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
