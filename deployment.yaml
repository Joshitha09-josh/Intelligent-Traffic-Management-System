
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-dashboard
  labels:
    app: traffic-dashboard
spec:
  replicas: 2

  selector:
    matchLabels:
      app: traffic-dashboard

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  revisionHistoryLimit: 5

  template:
    metadata:
      labels:
        app: traffic-dashboard
    spec:
      containers:
        - name: traffic-app
          image: balaji00002/traffic-management-dashboard:v1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: traffic-dashboard-service
  labels:
    app: traffic-dashboard
spec:
  type: NodePort

  selector:
    app: traffic-dashboard

  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
